# ============================================================================
# FastTunnel 客户端配置示例 —— INI 格式
#
# 使用方法：把本文件复制为 appsettings.ini 放在客户端程序目录。
# appsettings.json 由默认加载，.ini 变体（含 appsettings.{Environment}.ini）
# 后加载覆盖先加载。
#
# 注意：appsettings.sample.ini 不会被自动加载。
# Webs / Forwards 等列表结构在 INI 里用节名下标表达。
# ============================================================================
[Serilog:MinimumLevel]
Default=Information

[Serilog:MinimumLevel:Override]
Microsoft=Warning

[FastTunnel:Server]
# 服务端地址与通信端口
ServerAddr=127.0.0.1
ServerPort=1270

; wss（TLS 加密，默认）或 ws（明文）
Protocol=wss

; 自签证书场景：填服务端启动日志里打印的 SHA-256 指纹
CertificateFingerprint=

; 服务端分配给本客户端的一户一 token（对应服务端 Clients[].Token）
[FastTunnel]
Token=UNIQUE_TOKEN_FOR_ALICE
EnableMux=True
MuxTransport=tcp

; HTTP 穿透：公网访问 alice.test.cc 会转发到本机 5000
[FastTunnel:Webs:0]
SubDomain=alice
LocalHost=127.0.0.1
LocalPort=5000

; TCP 端口转发
[FastTunnel:Forwards:0]
RemotePort=7777
LocalHost=127.0.0.1
LocalPort=3389
