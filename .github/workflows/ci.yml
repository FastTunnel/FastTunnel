name: CI

# 每次 push 到 v2 和每个针对 v2 的 PR 都跑一遍单元测试。
# 单独成文而不是挂在 dotnetcore.yml 的 build job 上：那个文件里的 nuget / docker
# job 在 PR 上拿不到 secrets，只会多一堆与改动无关的红叉。

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build FastTunnel.sln -c Release --nologo

      - name: Test
        run: dotnet test FastTunnel.sln -c Release --no-build --nologo
