name: CI

# 每次 push 到 v3 和每个针对 v3 的 PR 都跑一遍单元测试。
# 单独成文而不是挂在 dotnetcore.yml 上：那个文件里的 docker job 在 PR 上
# 拿不到 secrets，只会多一堆与改动无关的红叉。

on:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 只编译不打包：nupkg 由 release.yml 在打 tag 时统一产出
      - name: Build
        run: dotnet build FastTunnel.sln -c Release --nologo -p:GeneratePackageOnBuild=false

      - name: Test
        run: >
          dotnet test FastTunnel.sln -c Release --no-build --nologo
          --logger "trx;LogFileName=test-results.trx"
          --results-directory FastTunnel.Core.Tests/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: FastTunnel.Core.Tests/TestResults
          if-no-files-found: ignore
