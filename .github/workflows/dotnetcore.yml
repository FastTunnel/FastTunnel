name: Build

# 只负责 docker 镜像的持续推送（push 到 v3 即出 latest）。
# 单元测试在 ci.yml，nuget 与各平台产物在 release.yml（tag 触发），
# 这里不再重复发包——旧的那几个 publish-nuget job 已经删掉。

on:
  push:
    branches:
      - v3

env:
  # 设置 docker 镜像名
  IMAGE_NAME: fasttunnel

jobs:
  docker:
    name: publish-docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # 构建镜像，指定镜像名
      - name: Build image
        run: docker build . --file Dockerfile --tag $IMAGE_NAME
        # 登录到 dockerhub，使用 GitHub secrets 传入账号密码，密码被加密存储在 GitHub 服务器，添加方法见下图。
      - name: Log into registry
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u springhgui --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=springhgui/$IMAGE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$(date "+%Y.%m.%d")

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          # 设置镜像 id 和版本号
          echo [tag] $IMAGE_NAME $IMAGE_ID:$VERSION
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          # 进行 push
          echo [push] $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
          # 再上传一份覆盖latest
          echo [tag] $IMAGE_ID:$VERSION $IMAGE_ID:latest
          docker tag $IMAGE_ID:$VERSION $IMAGE_ID:latest

          echo [push] $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
