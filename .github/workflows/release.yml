name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（tag 名，如 v3.4.0）'
        required: true
        default: 'v3.4.0'
      prerelease:
        description: '是否预发布'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.runtime }}
        run: |
          RID=${{ matrix.runtime }}
          STAGE="dist/FastTunnel-${RID}"
          mkdir -p "$STAGE/server" "$STAGE/client"
          dotnet publish FastTunnel.Server/FastTunnel.Server.csproj -c Release -r "$RID" --self-contained false -o "$STAGE/server"
          dotnet publish FastTunnel.Client/FastTunnel.Client.csproj -c Release -r "$RID" --self-contained false -o "$STAGE/client"
          cp LICENSE "$STAGE/" || true
          cd dist && zip -qr "FastTunnel-${RID}.zip" "FastTunnel-${RID}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.runtime }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git tag -f "$VERSION"
          git push -f origin "$VERSION"
          gh release delete "$VERSION" --yes 2>/dev/null || true
          gh release create "$VERSION" ../assets/*.zip \
            --repo "${{ github.repository }}" \
            --title "FastTunnel $VERSION" \
            --generate-notes \
            ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '' }}
