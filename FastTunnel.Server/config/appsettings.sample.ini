# ============================================================================
# FastTunnel 服务端配置示例 —— INI 格式
#
# 使用方法：把本文件复制为 config/appsettings.ini。
# 服务端按 json → ini 的顺序加载 config/ 下所有实际存在的 appsettings 基础文件
# （后加载覆盖先加载），随后追加环境变体 appsettings.{Environment}.ini。
#
# 注意：appsettings.sample.ini 不会被自动加载。
# 所有格式都支持热重载：改完文件保存即可生效，无需重启服务。
#
# INI 没有原生数组：需要列表时用节名下标（如 [FastTunnel:Clients:0]），
# 数组/嵌套结构复杂的场景建议继续用 appsettings.json，INI 适合做少量覆盖。
# ============================================================================
[FastTunnel]
# 通信端口（客户端 Server.Port）
BinPort=1270

# 访客访问的根域名：xxx.test.cc 会转发到对应客户端
WebDomain=test.cc

# TCP 端口转发总开关 / 多路复用
EnableForward=True

; TCP/UDP 端口白名单：Single 放行单端口，Start/End 放行闭区间；
; 空列表 = 不限制。配置后白名单外的端口一律拒绝登记。示例（去掉行首分号生效）：
;[FastTunnel:AllowPorts:0]
;Start=10000
;End=20000

; 单个客户端最多占用的转发端口数（0 = 不限制）
MaxPortsPerClient=0

; 代理组负载均衡：无需服务端配置，多个客户端用相同的 Group / GroupKey / 域名
; 注册即自动成组，按请求随机分发给组内存活成员。这里只调被动摘除灵敏度：
; 成员连续转发失败 FailureThreshold 次暂时出池，RecoverySeconds 秒后自动回池。
[FastTunnel:LoadBalancer]
FailureThreshold=3
RecoverySeconds=30
EnableMux=True

# 同一主体只允许一个在线会话：新登录顶掉旧会话
EnforceSingleSession=True

; 一户一 token：每个用户一条独立凭据、一个稳定主体 Id。
; 封禁 / 审计 / 带宽统计都按 Id 归属；配置了 Clients 就强制校验 token。
[FastTunnel:Clients:0]
Id=alice
Token=UNIQUE_TOKEN_FOR_ALICE
SubDomain=alice
BandwidthLimit=1048576
Enabled=True

[FastTunnel:Clients:1]
Id=bob
Token=UNIQUE_TOKEN_FOR_BOB

; 带宽限速（字节/秒，0 = 不限速）
[FastTunnel:Bandwidth]
DefaultBytesPerSecond=0
BurstSeconds=1

; 违规管控：封禁状态与审计留痕
[FastTunnel:Abuse:Ban]
StateFile=config/bans.json

[FastTunnel:Abuse:Audit]
FilePath=config/audit.jsonl
MemoryCapacity=10000

; 管理后台 API（JWT）
[FastTunnel:Api:JWT]
ValidAudience=FastTunnel
ValidIssuer=FastTunnel
IssuerSigningKey=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
Expires=3600

[FastTunnel:Api:Accounts:0]
Name=admin
Password=CHANGE_ME
